    <!-- NeetoForm element-click embed code begins -->
    <script>
      window.neetoForm = window.neetoForm || {
        embed: function () {
          (neetoForm.q = neetoForm.q || []).push(arguments);
        },
      };
    </script>
    <script
      async
      src="https://ieeelink.neetoform.com/javascript/embed.js"
    ></script>
    <script>
      // Safely initialize NeetoForm only when the target element exists.
      // This avoids embed.js logging errors on pages (like /venue) that
      // don't render the #ticket-button element.
      (function () {
        const embedConfig = {
          type: "elementClick",
          id: "4a08fa58-fa69-4855-a6aa-424b7d0c7513",
          organization: "ieeelink",
          elementSelector: "#ticket-button",
        };

        function tryEmbed() {
          try {
            if (document.querySelector("#ticket-button")) {
              // neetoForm is a queuing function defined above; calling
              // embed will queue the request until embed.js finishes loading.
              if (typeof neetoForm !== "undefined" && neetoForm.embed) {
                neetoForm.embed(embedConfig);
              }
              return true;
            }
          } catch (e) {
            // ignore
          }
          return false;
        }

        // Try immediately (in case element is already present)
        if (tryEmbed()) return;

        // Try on DOMContentLoaded
        document.addEventListener("DOMContentLoaded", function () {
          if (tryEmbed()) return;

          // As a fallback for SPA navigation or late-rendered elements,
          // observe the DOM for the element and embed once it appears.
          const observer = new MutationObserver((mutations, obs) => {
            if (tryEmbed()) {
              obs.disconnect();
            }
          });
          observer.observe(document.body, { childList: true, subtree: true });

          // Stop observing after 10s to avoid leaks
          setTimeout(() => observer.disconnect(), 10000);
        });
      })();
    </script>
    <!-- NeetoForm element-click embed code ends -->
